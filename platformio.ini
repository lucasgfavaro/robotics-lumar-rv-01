[platformio]
src_dir = firmware
[env:esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_src_filter = -<*> +<esp8266/main.cpp>
lib_deps = links2004/WebSockets@2.7.2
           bblanchon/ArduinoJson@6.21.5
[env:mini_left]
platform = atmelavr@5.1.0
board = pro16MHzatmega328
framework = arduino
build_src_filter = -<*> +<mini/main.cpp>
build_flags = -DROVER_I2C_ADDRESS=0x10
[env:mini_right]
extends = env:mini_left
build_flags = -DROVER_I2C_ADDRESS=0x11
